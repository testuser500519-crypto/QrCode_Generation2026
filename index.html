<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem('theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t</script>
<title>الحليوة لتوليد الكيواركود</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pico:#192a56;--mazarine:#273c75;--pylon:#00a8ff;--peri:#9c88ff;--shine:#fbc531;--gold:#e1b12c;--skirret:#44bd32;--flower:#e84118;--lynx:#f5f6fa;--hint:#dcdde1;--grey:#718093;--soda:#7f8fa6}
:root{--bg:var(--lynx);--surface:#fff;--field:var(--lynx);--line:var(--hint);--text:var(--pico);--muted:var(--grey);--act-bg:var(--mazarine);--act-fg:#fff;--hdr:var(--mazarine);--pv:var(--pico);--shadow:rgba(25,42,86,.55);color-scheme:light}
:root[data-theme=dark]{--bg:var(--pico);--surface:var(--mazarine);--field:var(--pico);--line:rgba(255,255,255,.18);--text:var(--lynx);--muted:var(--hint);--act-bg:var(--pylon);--act-fg:var(--pico);--hdr:var(--pico);--pv:#2f3640;--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
header{background:var(--hdr);color:#fff;padding:44px 16px 96px;border-bottom:6px solid var(--pylon)}
.wrap{max-width:1000px;margin:0 auto;position:relative}
.theme{position:absolute;top:-24px;inset-inline-end:0;font:inherit;font-size:.88rem;padding:5px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;cursor:pointer;transition:background .15s}
.theme:hover{background:rgba(255,255,255,.14)}
.brand{display:inline-block;background:var(--shine);color:var(--pico);padding:3px 14px;border-radius:999px;font-size:.88rem;font-weight:700;margin-bottom:14px}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:700;margin:0 0 8px;line-height:1.25}
.sub{margin:0;color:var(--hint);max-width:560px}
main{max-width:1000px;margin:-64px auto 0;padding:0 16px 56px}
.grid{display:grid;grid-template-columns:1fr 350px;gap:22px;align-items:start}
@media(max-width:780px){.grid{grid-template-columns:1fr}header{padding-bottom:84px}}
.panel{background:var(--surface);border-radius:20px;padding:24px;box-shadow:0 18px 40px -22px var(--shadow)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tabs button{font:inherit;font-weight:500;padding:8px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tabs button:hover{border-color:var(--pylon)}
.tabs button[aria-pressed=true]{background:var(--act-bg);color:var(--act-fg);border-color:var(--act-bg)}
label{display:block;font-weight:500;margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pylon);box-shadow:0 0 0 4px rgba(0,168,255,.2)}
input[type=color]{padding:3px;height:46px;cursor:pointer}
input[type=file]{padding:9px 12px}
textarea{resize:vertical;min-height:90px}
button:focus-visible{outline:3px solid var(--pylon);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
h2{font-size:1.15rem;font-weight:700;margin:28px 0 0;padding-top:20px;border-top:1.5px dashed var(--line)}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.up{width:100%;margin-top:10px;font:inherit;font-weight:500;padding:11px;border:0;border-radius:12px;background:var(--act-bg);color:var(--act-fg);cursor:pointer;transition:filter .15s}
.up:hover:not(:disabled){filter:brightness(1.12)}
.up:disabled{opacity:.6;cursor:wait}
.msg{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--field);border-inline-start:4px solid var(--pylon);font-size:.92rem}
.msg.ok{border-color:var(--skirret)}
.msg.err{border-color:var(--flower)}
.preview{position:sticky;top:16px;background:var(--pv);color:#fff;text-align:center}
.preview h2{border:0;margin:0 0 14px;padding:0;font-size:1.05rem;color:var(--soda);text-align:start}
#qr{display:flex;justify-content:center;align-items:center;min-height:322px;background:#fff;border-radius:16px;padding:16px}
#qr canvas{max-width:100%;height:auto}
.empty{color:var(--grey);padding:0 16px;margin:0}
.dl{display:flex;gap:10px;margin-top:16px}
.dl button{flex:1;font:inherit;font-weight:700;padding:13px;border-radius:12px;border:2px solid var(--shine);background:var(--shine);color:var(--pico);cursor:pointer;transition:transform .12s,background .15s}
.dl button:hover:not(:disabled){transform:translateY(-2px);background:var(--gold);border-color:var(--gold)}
.dl button.alt{background:transparent;color:#fff;border-color:var(--grey)}
.dl button.alt:hover:not(:disabled){background:transparent;border-color:var(--pylon)}
.dl button:disabled{background:var(--mazarine);border-color:var(--mazarine);color:var(--soda);cursor:not-allowed}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
<button type="button" class="theme" id="themeBtn"></button>
<span class="brand">مجاني وبدون حد</span>
<h1>الحليوة لتوليد الكيواركود</h1>
<p class="sub">اختر النوع، املأ البيانات، ونزّل الكود. التوليد بيتم في متصفحك.</p>
</div></header>
<main>
<div class="grid">
  <section class="panel">
    <div class="tabs" id="tabs" role="group" aria-label="نوع الكيواركود"></div>
    <div id="fields"></div>

    <h2>الشكل</h2>
    <div class="row">
      <div><label for="fg">لون الكود</label><input type="color" id="fg" value="#273c75"></div>
      <div><label for="bg">لون الخلفية</label><input type="color" id="bg" value="#ffffff"></div>
    </div>
    <div class="row">
      <div><label for="dots">شكل النقاط</label>
        <select id="dots"><option value="square">مربع</option><option value="rounded">مدوّر</option><option value="dots">دوائر</option><option value="classy">أنيق</option></select></div>
      <div><label for="size">الحجم (بكسل)</label>
        <select id="size"><option>300</option><option>600</option><option selected>1000</option><option>2000</option></select></div>
    </div>
    <label for="logo">لوجو في النص (اختياري)</label>
    <input type="file" id="logo" accept="image/*">
    <p class="hint">مع اللوجو بنرفع تصحيح الأخطاء تلقائياً عشان الكود يفضل يتقرأ.</p>
  </section>

  <aside class="panel preview">
    <h2>المعاينة</h2>
    <div id="qr"></div>
    <div class="dl">
      <button id="png" disabled>تحميل PNG</button>
      <button id="svg" class="alt" disabled>تحميل SVG</button>
    </div>
  </aside>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script>
const esc = s => String(s).replace(/([\\;,:"])/g, '\\$1');
const TYPES = {
  text:  {name:'رابط أو نص', f:[{id:'v',l:'الرابط أو النص',t:'area',p:'https://example.com'}], b:v=>v.v},
  file:  {name:'صورة أو ملف', f:[{id:'up',t:'upload'},{id:'v',l:'أو الصق رابط جاهز',t:'url',p:'https://drive.google.com/...'}], b:v=>v.v, hint:'الكيواركود مش بيحتوي الصورة نفسها، لكن بيفتح رابطها على Drive.'},
  wifi:  {name:'واي فاي', f:[{id:'s',l:'اسم الشبكة'},{id:'p',l:'كلمة السر'},{id:'e',l:'التشفير',t:'sel',o:[['WPA','WPA/WPA2'],['WEP','WEP'],['nopass','بدون كلمة سر']]}],
          b:v=>v.s?`WIFI:T:${v.e};S:${esc(v.s)};P:${esc(v.p||'')};;`:''},
  wa:    {name:'واتساب', f:[{id:'n',l:'الرقم بكود الدولة (بدون +)',p:'201001234567'},{id:'m',l:'رسالة جاهزة (اختياري)',t:'area'}],
          b:v=>{const n=(v.n||'').replace(/\D/g,'');return n?`https://wa.me/${n}`+(v.m?`?text=${encodeURIComponent(v.m)}`:''):''}},
  mail:  {name:'إيميل', f:[{id:'a',l:'عنوان الإيميل',p:'name@example.com'},{id:'s',l:'الموضوع (اختياري)'},{id:'m',l:'النص (اختياري)',t:'area'}],
          b:v=>{if(!v.a)return'';const q=[v.s&&'subject='+encodeURIComponent(v.s),v.m&&'body='+encodeURIComponent(v.m)].filter(Boolean).join('&');return `mailto:${v.a}`+(q?'?'+q:'')}},
  tel:   {name:'اتصال', f:[{id:'n',l:'رقم الهاتف',p:'+201001234567'}], b:v=>v.n?`tel:${v.n.replace(/\s/g,'')}`:''}
};
let cur = 'text';
const $ = id => document.getElementById(id);
const qr = new QRCodeStyling({width:300,height:300,data:' ',type:'canvas'});
let logoData = null;

function renderTabs(){
  $('tabs').innerHTML='';
  for(const k in TYPES){
    const b=document.createElement('button');
    b.textContent=TYPES[k].name; b.setAttribute('aria-pressed',k===cur);
    b.onclick=()=>{cur=k;renderTabs();renderFields();update()};
    $('tabs').appendChild(b);
  }
}
function renderFields(){
  const T=TYPES[cur]; let h='';
  for(const f of T.f){
    if(f.t==='upload'){h+=`<label for="f_up">ارفع صورة أو ملف (لحد 8 ميجا)</label><input id="f_up" type="file"><button type="button" class="up" id="upBtn">ارفع على Drive</button><p class="msg" id="upMsg" hidden></p>`;continue}
    h+=`<label for="f_${f.id}">${f.l}</label>`;
    if(f.t==='area') h+=`<textarea id="f_${f.id}" placeholder="${f.p||''}"></textarea>`;
    else if(f.t==='sel') h+=`<select id="f_${f.id}">${f.o.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`;
    else h+=`<input id="f_${f.id}" type="${f.t==='url'?'url':'text'}" placeholder="${f.p||''}" dir="auto">`;
  }
  if(T.hint) h+=`<p class="hint">${T.hint}</p>`;
  $('fields').innerHTML=h;
  if($('upBtn'))$('upBtn').onclick=upload;
  $('fields').querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',update));
}
function values(){const v={};TYPES[cur].f.forEach(f=>v[f.id]=$('f_'+f.id).value.trim());return v}

function update(){
  const data=TYPES[cur].b(values());
  const box=$('qr'); box.innerHTML='';
  const ok=!!data;
  $('png').disabled=$('svg').disabled=!ok;
  if(!ok){box.innerHTML='<p class="empty">املأ البيانات وهيظهر الكيواركود هنا.</p>';return}
  qr.update({
    data, width:300, height:300, type:'canvas',
    qrOptions:{errorCorrectionLevel: logoData?'H':'M'},
    dotsOptions:{color:$('fg').value,type:$('dots').value},
    cornersSquareOptions:{color:$('fg').value},
    backgroundOptions:{color:$('bg').value},
    image:logoData||undefined,
    imageOptions:{margin:4,imageSize:0.3,crossOrigin:'anonymous'}
  });
  qr.append(box);
}
function download(ext){
  const s=+$('size').value;
  qr.update({width:s,height:s,type:ext==='svg'?'svg':'canvas'});
  qr.download({name:'qrcode',extension:ext}).then?.(update) ?? setTimeout(update,500);
}
$('png').onclick=()=>download('png');
$('svg').onclick=()=>download('svg');
['fg','bg','dots'].forEach(i=>$(i).addEventListener('input',update));
$('logo').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f){logoData=null;update();return}
  const r=new FileReader(); r.onload=()=>{logoData=r.result;update()}; r.readAsDataURL(f);
});
// إعدادات رفع Drive: الصق رابط الـ Web App وكلمة السر (نفس TOKEN في Code.gs)
const UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbx6K6wYU-KsX2dVDnk3Y7zjmCSFjeQoZ8TzlTtZ7-J3y8zM7oUNhHookXFoRG2f7HE/exec';
const UPLOAD_TOKEN = 'yasser500519';

function setMsg(t,c){const m=$('upMsg');m.hidden=false;m.className='msg '+(c||'');m.textContent=t}
async function upload(){
  const f=$('f_up').files[0], btn=$('upBtn');
  if(!UPLOAD_URL) return setMsg('الرفع مش مفعّل لسه: حط رابط الـ Web App في UPLOAD_URL جوه الملف.','err');
  if(!f) return setMsg('اختار ملف الأول.','err');
  if(f.size>8*1024*1024) return setMsg('الملف أكبر من 8 ميجا.','err');
  btn.disabled=true; setMsg('جاري الرفع...');
  try{
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
    const r=await fetch(UPLOAD_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:UPLOAD_TOKEN,name:f.name,mime:f.type||'application/octet-stream',data})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'فشل الرفع');
    $('f_v').value=j.url; update(); setMsg('تم الرفع، والكيواركود اتحدّث.','ok');
  }catch(e){ setMsg('فشل الرفع: '+(e.message||e),'err') }
  finally{ btn.disabled=false }
}
const root=document.documentElement;
function themeLabel(){const d=root.dataset.theme==='dark';$('themeBtn').textContent=d?'☀ الوضع الفاتح':'☾ الوضع الداكن';$('themeBtn').setAttribute('aria-pressed',d)}
$('themeBtn').onclick=()=>{const t=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}themeLabel()};
themeLabel();
renderTabs(); renderFields(); update();
</script>
</body>
</html>
